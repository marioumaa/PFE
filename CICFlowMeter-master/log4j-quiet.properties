# Configuration log4j minimale pour l'invocation CLI de CICFlowMeter depuis Python.
# Remplace le log4j.properties embarqué dans le jar (qui écrit des logs de debug
# illimités dans logs/debug et logs/info.log, jusqu'à 5 Go chacun) : ici, uniquement
# la console, niveau WARN (nos propres logs Python couvrent déjà le suivi utile).
log4j.rootLogger=WARN,CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%c %m%n
